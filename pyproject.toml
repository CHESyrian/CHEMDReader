[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemdreader"
version = "1.0.0"
description = "A secure Flask Markdown and LaTeX folder reader"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "CHEMDReader contributors" }]
dependencies = [
    "flask==3.1.3",
    "markdown==3.11",
    "bleach==6.4.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["app"]
include-package-data = true
